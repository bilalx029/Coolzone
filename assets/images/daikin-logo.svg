<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <!-- Daikin Iconic Chevron/Triangle Graphic -->
  <g>
    <!-- Top black corner -->
    <polygon points="0,4 24,4 0,30" fill="#111827" />
    <!-- Cyan diagonal slash -->
    <polygon points="0,30 24,4 42,4 0,50" fill="#00A0E9" />
  </g>
  <!-- Daikin Logotype -->
  <g transform="translate(54, 43)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-style="italic" 
          font-size="42" 
          letter-spacing="0.5px" 
          fill="#00A0E9">DAIKIN</text>
  </g>
</svg>
