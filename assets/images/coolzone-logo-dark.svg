<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Coolzone Modern Dynamic Snowflake / Vortex Emblem -->
  <g transform="translate(4, 6)">
    <circle cx="24" cy="24" r="22" fill="#00A0E9" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 24 6 C 24 16, 32 20, 42 24 C 32 24, 28 32, 24 42 C 24 32, 16 28, 6 24 C 16 24, 20 16, 24 6 Z" fill="url(#coolGradientDark)" />
    <circle cx="24" cy="24" r="4.5" fill="#ffffff" />
    <circle cx="24" cy="24" r="2" fill="#00A0E9" />
  </g>

  <!-- Coolzone Logotype for Dark Surfaces -->
  <g transform="translate(62, 38)">
    <text font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" 
          font-weight="900" 
          font-size="32" 
          letter-spacing="0.5px" 
          fill="#ffffff">COOL<tspan fill="#38bdf8">ZONE</tspan></text>
  </g>

  <!-- Sub-label -->
  <g transform="translate(64, 52)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-weight="700" 
          font-size="8.5" 
          letter-spacing="2px" 
          fill="#94a3b8">AIR CONDITIONING SOLUTIONS</text>
  </g>

  <defs>
    <linearGradient id="coolGradientDark" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00A0E9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
</svg>
